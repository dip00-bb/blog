[build.environment]
  # NEXT_PUBLIC_* variables are public, client-exposed values (the NEXT_PUBLIC_
  # prefix inlines them into the browser bundle), so they are not secrets.
  # Exclude them from Netlify's secrets scanning so builds don't fail when the
  # URL appears in docs, source files, or build output.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_APP_URL"
